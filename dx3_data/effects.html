<html>
    <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta name="viewport" content="width=480" />
    <title>ダブルクロス The 3rd Edition エフェクト一覧</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <script src="advanced.js"></script>
    <script src="ea.js"></script>
    <script src="others.js"></script>
</head>
<body>
    <p><a href=./>戻る</a></p>
    <p id="reference">
        掲載:
    </p>
    <p id="d-roise">
        Dロイス:
    </p>
    <p id="syndromes">
        シンドローム:
    </p>
    <hr>
    <div id="table-holder">
<script>
        let d_roise_list = ['すべて'];
        let syndrome_list = ['すべて']

        const suffix_list = {
            '新規': 'red',
            '改定': 'blue',
            '旧': 'gray',
        }
        const mode_list = {
            'EA' : ea,
            '上級' : advanced,
            'その他' : others,
        }

        let url = new URL(window.location.href);
        let params = url.searchParams;
        let syndrome = params.get('syndrome') ? params.get('syndrome') : 'すべて';
        let d_roise = params.get('d_roise') ? params.get('d_roise') : 'すべて';
        let mode = params.get('mode') ? params.get('mode') : 'EA';

        const dataArray = mode_list[mode];

        dataArray.forEach((item) => {
            if (item["Dロイス"] && !d_roise_list.includes(item["Dロイス"])) {
                d_roise_list.push(item["Dロイス"]);
            }
            if (!d_roise || d_roise === 'すべて' || item["Dロイス"] === d_roise) {
                if (!syndrome_list.includes(item["シンドローム"])) {
                    syndrome_list.push(item["シンドローム"]);
                }
            }
        });

        reference_line = document.getElementById('reference');
        for (key in mode_list) {
            const link = document.createElement('a');
            if (key !== mode) {
                link.href = `?mode=${key}`;
            } else {
                link.style.fontWeight = 'bold';
            }
            link.textContent = key;
            reference_line.appendChild(link);
            reference_line.appendChild(document.createTextNode(' / '));
        }

        const d_roiseLine = document.getElementById('d-roise');
        d_roise_list.forEach((d_roiseName, index) => {
            if (index > 0) {
                d_roiseLine.appendChild(document.createTextNode(' / '));
            }
            const link = document.createElement('a');
            if (d_roiseName !== d_roise) {
                link.href = `?mode=${mode}&syndrome=${syndrome}&d_roise=${d_roiseName}`;
            } else {
                link.style.fontWeight = 'bold';
            }
            link.textContent = d_roiseName;
            d_roiseLine.appendChild(link);
        });

        const syndromesLine = document.getElementById('syndromes');
        syndrome_list.forEach((syndromeName, index) => {
            if (index > 0) {
                syndromesLine.appendChild(document.createTextNode(' / '));
            }
            const link = document.createElement('a');
            if (syndromeName !== syndrome) {
                link.href = `?mode=${mode}&syndrome=${syndromeName}&&d_roise=${d_roise}`;
            } else {
                link.style.fontWeight = 'bold';
            }
            link.textContent = syndromeName;
            syndromesLine.appendChild(link);
        });

        const filteredData = dataArray.filter(item => {
            return (!d_roise || d_roise === 'すべて' || item["Dロイス"] === d_roise) &&
                (!syndrome || syndrome === 'すべて' || item["シンドローム"] === syndrome);
        });
        var tableHTML = '';
        filteredData.forEach((item, index) => {
            tableHTML += `
                <table class="type02">
                    <tbody>
                        <tr>
                            <th rowspan="6" bgcolor="${item["種別"] === 'イージー' ? 'lightgreen' : '#eee'}">
                                <font color="${suffix_list[item["新規・改定"]] || 'black'}">${item["エフェクト名"]}${suffix_list[item["新規・改定"]] ? `(${item["新規・改定"]})` : ''}</font><br><br>
                                <font size="-1">${item["シンドローム"]} / ${item["種別"]}</font><br><br>
                                <font size="-1">Dロイス: ${item["Dロイス"] || 'なし'}</font><br><br>
                                <font size="-1">${item["掲載"] || ''}</font>
                            </th>
                            <td colspan="2">最大Lv: ${item["最大Lv"]}</td>
                        </tr>
                        <tr>
                            <td colspan="2">タイミング: ${item["タイミング"]}</td>
                        </tr>
                        <tr>
                            <td>技能: ${item["技能"]}</td>
                            <td>難易度: ${item["難易度"]}</td>
                        </tr>
                        <tr>
                            <td>対象: ${item["対象"]}</td>
                            <td>射程: ${item["射程"]}</td>
                        </tr>
                        <tr>
                            <td>侵蝕値: ${item["侵蝕値"]}</td>
                            <td>制限: ${item["制限"]}</td>
                        </tr>
                        <tr>
                            <td colspan="2">${decodeURIComponent(escape(window.atob(item["簡略効果"])))}</td>
                        </tr>
                    </tbody>
                </table>
            `;
        });
        const tableHolder = document.getElementById('table-holder');
        tableHolder.innerHTML = tableHTML;
    </script>

</body>
</html>
